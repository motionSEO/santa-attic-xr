<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santa Module Test</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a1a10; overflow: hidden; font-family: "Malgun Gothic", system-ui, sans-serif; }
  #ui { position: fixed; left: 16px; top: 16px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 32px); z-index: 2; }
  #ui button { padding: 7px 12px; border-radius: 8px; border: 1px solid #d9b46a; background: rgba(40,28,14,.85); color: #f6e7c6; cursor: pointer; }
  #ui button.on { background: #c8282c; }
</style>
<script src="modules/santa.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <button id="walk">걸어오기</button>
  <button id="wave">손 흔들기</button>
  <button id="talk">말하기</button>
  <span id="exprs"></span>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a1a10);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 50);
camera.position.set(0, 1.4, 3);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0); controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffd2a0, 0x3a1e0e, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(1, 3, 2); key.castShadow = true; scene.add(key);
const floor = new THREE.Mesh(new THREE.CircleGeometry(4, 40), new THREE.MeshStandardMaterial({ color: 0x6a3a1c }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const santa = createSanta(THREE);
scene.add(santa.object);

const $ = (id) => document.getElementById(id);
let busy = false;
$("walk").onclick = async () => {
  if (busy) return; busy = true;
  santa.object.position.set(-2.5, 0, -2); santa.object.rotation.y = 0;
  await santa.walkTo(new THREE.Vector3(0, 0, 0), { via: new THREE.Vector3(-1.5, 0, 0.3) });
  await santa.turnTo(camera.position);
  busy = false;
};
const toggle = (id, fn) => { let on = false; $(id).onclick = () => { on = !on; $(id).classList.toggle("on", on); fn(on); }; };
toggle("wave", (on) => santa.wave(on));
toggle("talk", (on) => santa.talk(on));
for (const name of santa.expressions) {
  const b = document.createElement("button"); b.textContent = name;
  b.onclick = () => { santa.setExpression(name); document.querySelectorAll("#exprs button").forEach((x) => x.classList.toggle("on", x === b)); };
  $("exprs").appendChild(b);
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  santa.update(dt, camera.position);
  controls.update();
  renderer.render(scene, camera);
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
