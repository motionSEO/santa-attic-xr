<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Santa Attic</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#0b0d12; overflow:hidden;
    font:13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color:#e8e3da; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  #hud { position:fixed; left:16px; top:16px; z-index:16; display:flex; flex-direction:column; gap:8px;
    max-width:min(280px, calc(100vw - 32px)); }
  .panel { background:rgba(16,14,12,.72); backdrop-filter:blur(8px);
    border:1px solid rgba(255,220,180,.14); border-radius:10px; padding:10px 12px; }
  .panel h1 { margin:0 0 8px; font-size:13px; font-weight:600; letter-spacing:.02em; color:#ffd9a8; }
  .row { display:flex; gap:6px; flex-wrap:wrap; }
  button { font:inherit; color:#e8e3da; background:rgba(255,215,170,.10);
    border:1px solid rgba(255,215,170,.22); border-radius:7px; padding:5px 9px; cursor:pointer; }
  button:hover { background:rgba(255,215,170,.20); }
  button[aria-pressed="true"] { background:#c2742f; border-color:#e0a05a; color:#1a1208; font-weight:600; }
  label.slider { display:flex; align-items:center; gap:8px; margin-top:7px; font-size:12px; color:#c9c0b2; }
  label.slider input { flex:1; accent-color:#d98c3a; }
  label.slider b { min-width:34px; text-align:right; font-variant-numeric:tabular-nums; color:#e8e3da; font-weight:600; }

  #loading { position:fixed; inset:0; z-index:20; display:grid; place-content:center; gap:14px;
    background:#0b0d12; transition:opacity .5s ease; text-align:center; }
  #loading.done { opacity:0; pointer-events:none; }
  #bar { width:220px; height:3px; background:rgba(255,255,255,.12); border-radius:2px; overflow:hidden; }
  #bar i { display:block; height:100%; width:0%; background:#d98c3a; transition:width .2s ease; }
  #err { position:fixed; inset:auto 16px 16px; z-index:30; display:none; padding:12px 14px;
    background:#3a1515; border:1px solid #7a3030; border-radius:10px; white-space:pre-wrap; font-size:12px; }

  #toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); z-index:14; padding:7px 14px; border-radius:20px;
    background:rgba(16,14,12,.75); color:#ffd9a8; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; }
  #toast.on { opacity:1; }
  #cross { position:fixed; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px; z-index:9;
    border-radius:50%; background:rgba(255,230,200,.85); box-shadow:0 0 0 1.5px rgba(0,0,0,.45); display:none; pointer-events:none; }
  body.locked #cross { display:block; }
  /* title screen: the game waits here until 시작하기 is pressed (the room keeps loading / shows dimly behind it) */
  #start { position:fixed; inset:0; z-index:15; display:grid; place-content:center; justify-items:center; text-align:center; gap:14px;
    padding:24px 16px; background:radial-gradient(ellipse at center, rgba(28,16,10,.78), rgba(6,5,4,.94)); }
  #start small { font-size:12px; letter-spacing:.32em; color:#d98c3a; font-weight:600; }
  #start h1 { margin:0; font-size:clamp(26px, 6vw, 44px); font-weight:700; color:#ffd9a8; line-height:1.2; letter-spacing:.01em; }
  #start p { margin:0; color:#c9c0b2; font-size:14px; line-height:1.6; max-width:420px; }
  #start button { margin-top:10px; padding:13px 44px; font:inherit; font-size:17px; font-weight:700; color:#2a1608; cursor:pointer;
    background:#ffd9a8; border:0; border-radius:999px; box-shadow:0 6px 24px rgba(217,140,58,.35); transition:transform .15s, background .15s; }
  #start button:hover { background:#ffe6c4; transform:translateY(-1px); }
  #start button:disabled { background:#5a4636; color:#c9b8a4; cursor:wait; box-shadow:none; transform:none; }
  #start span { color:#8f8577; font-size:12px; max-width:420px; line-height:1.6; }
  body.locked #start, body.started #start, body.xr #start { display:none; }
  body:not(.started):not(.xr) #hud { display:none; }   /* settings panel appears once the game has started */
  body.locked #hud { opacity:.35; pointer-events:none; }
  #cams, #mode, #pad { display:none !important; }
  #pad { position:fixed; left:24px; bottom:24px; z-index:12; width:120px; height:120px; border-radius:50%;
    border:1px solid rgba(255,215,170,.3); background:rgba(16,14,12,.35); display:none; touch-action:none; }
  #pad i { position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%;
    background:rgba(255,215,170,.35); }
  @media (pointer:coarse) { #pad { display:block; } }
  @media (max-width: 640px) { #hud { left:10px; top:10px; } .panel { padding:8px 10px; } }
#hint{display:none!important;position:fixed;top:14px;left:50%;transform:translateX(-50%);max-width:min(560px,90vw);padding:10px 16px;border-radius:12px;background:rgba(20,14,10,.78);color:#f3e6d3;font-size:14px;line-height:1.5;text-align:center;pointer-events:none;display:none;z-index:20}
</style>

<script type="module">
import * as THREE from 'three';
await window.herbsReady; await window.mugReady; await window.drawersReady; await window.turntableReady; await window.propsReady; await window.kitchenReady;
const { HerbGarden, MugModule, DrawerSet, Turntable, Jukebox, Prop } = window;
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { computeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';
THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';

const showErr = (m) => { const e = document.getElementById('err'); e.style.display='block'; e.textContent += m + '\n'; };
window.addEventListener('error', e => showErr('⚠ ' + e.message));
let toastT = 0;
const toast = () => {};   // no plain text notices during play (VR test feedback)

// ---------------------------------------------------------------- renderer
const app = document.getElementById('app');
// ONE performance profile for every device (from the space package: PC shows what the headset gets): no shadows, few lights,
// small textures, Lambert materials, instanced low-poly baubles. Only the render resolution differs. ?quest forces the Quest settings.
const LITE = true;
const QUEST = /OculusBrowser|Quest/i.test(navigator.userAgent) || /[?&]quest/.test(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: !QUEST, powerPreference:'high-performance' });
renderer.setPixelRatio(QUEST ? 1 : Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.AgXToneMapping;      // matches Blender's AgX view transform
renderer.toneMappingExposure = 1.23;              // Blender view exposure +0.3 stops = 2^0.3
renderer.shadowMap.enabled = !LITE;
renderer.localClippingEnabled = true;   // CONVEYOR: the tables are cut off where they pass through the walls
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.xr.enabled = true;
app.appendChild(renderer.domElement);
// Quest 3: ask for hand tracking (controllers keep working too)
document.body.appendChild(VRButton.createButton(renderer, { optionalFeatures: ['hand-tracking'] }));
if (LITE) { renderer.xr.setFoveation(0.5); renderer.xr.setFramebufferScaleFactor(0.8); }   // foveation is then adapted live (see the loop)
RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();

// Blender world: colour (0.05, 0.07, 0.11) at strength 0.22
const WORLD = new THREE.Color().setRGB(0.05, 0.07, 0.11, THREE.LinearSRGBColorSpace);
scene.background = WORLD.clone().multiplyScalar(0.3);
// cool from the snow outside, warm bounce off the timber floor - this is what makes it read cosy
const hemi = new THREE.HemisphereLight(
  new THREE.Color().setRGB(0.36, 0.34, 0.40, THREE.LinearSRGBColorSpace),
  new THREE.Color().setRGB(0.62, 0.30, 0.09, THREE.LinearSRGBColorSpace), 0.7);
scene.add(hemi);

// ---------------------------------------------------------------- player (first person)
// Desktop: the camera sits at player.feet + eye height, yaw/pitch from a right-button drag (the cursor stays free for clicking).
// VR: the camera lives in the rig; the rig stands on player.feet and the headset pose is added on top.
const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.02, 120);
scene.add(camera);
const rig = new THREE.Group();
scene.add(rig);
const controls = null;            // OrbitControls retired: this build is first-person only
let currentView = null;

// Blender is Z-up, glTF is Y-up:  three = (bx, bz, -by)
const B2T = (p) => new THREE.Vector3(p[0], p[2], -p[1]);

// spawn points (eye position + look target, from the Blender cameras)
const VIEWS = {
  '시작 위치': { pos:[1.07, 0.0, 1.60], target:[-0.5, 0.08, 1.05] },
  '창문':     { pos:[0.45, 0.05, 1.50], target:[-1.05, 0.03, 1.55] },
  '벽난로':   { pos:[0.15, 0.42, 1.55], target:[-0.52, 1.45, 0.72] },
  '옷걸이':   { pos:[1.55, 0.70, 1.45], target:[1.92, 1.98, 1.10] }
};

const P = {
  feet: new THREE.Vector3(),       // where the player stands (desktop and VR)
  vy: 0,                           // vertical speed (falling)
  eye: 1.55, eyeStand: 1.55, eyeCrouch: 0.95,
  radius: 0.2, step: 0.32, minHead: 1.05, ceil: 9, walk: 1.25, run: 2.6, gravity: 9.8
};
// The player stays in one spot at the work desk (no walking, no teleport): only the view turns.
const STAND = { feet: new THREE.Vector3(1.07, 0, 0), yaw: Math.PI / 2, pitch: -0.95 };   // in front of the lifted desk (same spot as the space package's player)
let walkMode = true;               // false = free-fly (no collision), for inspecting the scene
let yaw = 0, pitch = 0;
const keys = new Set();

function applyLook() {
  camera.rotation.order = 'YXZ';
  camera.rotation.set(pitch, yaw, 0);
}
function placeCamera() {
  if (renderer.xr.isPresenting) return;
  if (walkMode) camera.position.set(P.feet.x, P.feet.y + P.eye, P.feet.z);
  applyLook();
}

// ---- collision world: static meshes of the room, BVH-accelerated
THREE.Mesh.prototype.raycast = acceleratedRaycast;
const colliders = [];
const ray = new THREE.Raycaster();
ray.firstHitOnly = true;
function buildColliders(root) {
  root.updateMatrixWorld(true);
  const bb = new THREE.Box3(), sz = new THREE.Vector3();
  root.traverse(o => {
    if (!o.isMesh || !o.visible) return;
    const mn = (Array.isArray(o.material) ? o.material[0] : o.material)?.name || '';
    if (/^Out/.test(o.name) || /^Out/.test(mn)) return;                 // the night outside the window
    if (/^(DecoVine_|Mistletoe_|GLBWIN_)/.test(o.name)) return;          // hanging deco / garland
    if (/flame|bulb|glow|led|flake/i.test(mn)) return;
    bb.setFromObject(o).getSize(sz);
    if (Math.max(sz.x, sz.y, sz.z) < 0.25) return;                       // small props (mug, herbs, clutter) never block
    try { if (!o.geometry.boundsTree) o.geometry.computeBoundsTree(); } catch (e) { /* plain raycast fallback */ }
    colliders.push(o);
  });
  console.log('colliders:', colliders.length);
}
const heldByPlayer = (o) => { for (let p = o; p; p = p.parent) if (p === camera || p === rig) return true; return false; };
function cast(origin, dir, far) {
  ray.set(origin, dir); ray.near = 0; ray.far = far;
  const hits = ray.intersectObjects(colliders, false);
  for (const h of hits) if (!heldByPlayer(h.object)) return h;
  return null;
}
const _n = new THREE.Vector3(), _o = new THREE.Vector3(), _d = new THREE.Vector3(), DOWN = new THREE.Vector3(0, -1, 0), UP = new THREE.Vector3(0, 1, 0);
function hitNormal(h) {
  if (!h.face) return _n.copy(_d).negate();
  return _n.copy(h.face.normal).transformDirection(h.object.matrixWorld);
}
function floorAt(x, y, z) {          // highest walkable surface under (x, y + step, z)
  _o.set(x, y + P.step + 0.05, z);
  const h = cast(_o, DOWN, P.step + 4);
  return h ? h.point.y : null;
}

// move the feet by `move` (xz), sliding along walls; returns the new feet position
const _m = new THREE.Vector3(), _best = new THREE.Vector3();
function walkMove(feet, move, dt) {
  const start = feet.clone();
  _m.copy(move); _m.y = 0;
  const heights = [0.18 + P.step, 0.62, 0.95];          // walls/furniture; the sloped roof is handled by head room below
  for (let it = 0; it < 3; it++) {
    const len = _m.length(); if (len < 1e-6) break;
    _d.copy(_m).divideScalar(len);
    let best = null;
    for (const hgt of heights) {
      _o.set(feet.x, feet.y + hgt, feet.z);
      const h = cast(_o, _d, len + P.radius);
      if (h && (!best || h.distance < best.distance)) best = h;
    }
    if (!best) { feet.add(_m); break; }
    const go = Math.max(0, best.distance - P.radius);
    feet.addScaledVector(_d, go);
    _best.copy(hitNormal(best)); _best.y = 0;
    if (_best.lengthSq() < 1e-6) break;
    _best.normalize(); if (_best.dot(_d) > 0) _best.negate();
    _m.addScaledVector(_d, -go);                    // what is left of the move...
    _m.addScaledVector(_best, -_m.dot(_best));      // ...slides along the wall
  }
  // push out of anything we ended up too close to (corners, thin posts)
  for (const hgt of [0.45, 0.9, P.eye - 0.08]) for (let k = 0; k < 8; k++) {
    const a = k / 8 * Math.PI * 2; _d.set(Math.cos(a), 0, Math.sin(a));
    _o.set(feet.x, feet.y + hgt, feet.z);
    const h = cast(_o, _d, P.radius);
    if (h) feet.addScaledVector(_d, -(P.radius - h.distance));
  }
  // ground: step up small ledges, fall down otherwise; never walk off into the void
  const fy = floorAt(feet.x, feet.y, feet.z);
  if (fy === null) { feet.copy(start); return feet; }
  if (fy >= feet.y - 0.01) { feet.y = fy; P.vy = 0; }
  else { P.vy -= P.gravity * dt; feet.y = Math.max(fy, feet.y + P.vy * dt); if (feet.y === fy) P.vy = 0; }
  // head room: the attic roof slopes down to the floor; don't walk under it
  _o.set(feet.x, feet.y + 0.3, feet.z);
  const up = cast(_o, UP, 2.5);
  const clear = up ? up.distance + 0.3 : 9;
  if (clear < P.minHead) { feet.copy(start); }         // too low even ducking: the eaves stop you
  else P.ceil = clear;                                  // otherwise the eye ducks under it (moveStep)
  return feet;
}

// ---- input
const el = renderer.domElement;
el.addEventListener('contextmenu', e => e.preventDefault());
const startEl = document.getElementById('start');
const locked = () => document.pointerLockElement === el;
// PC: no pointer lock. The cursor stays free: right-drag looks around, left click interacts where the cursor is.
// title screen: only the 시작하기 button starts the game (it turns on once the room and the flow are ready)
const startBtn = document.getElementById('startBtn');
startBtn.addEventListener('click', () => { if (!window.__flow) return; document.body.classList.add('started'); window.__flow.begin(); });
const startReady = setInterval(() => { if (window.__flow) { clearInterval(startReady); startBtn.disabled = false; startBtn.textContent = '시작하기'; } }, 300);
document.addEventListener('pointerlockchange', () => document.body.classList.toggle('locked', locked()));
document.addEventListener('mousemove', e => {
  if (!locked()) return;
  yaw   -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = THREE.MathUtils.clamp(pitch, -1.5, 1.5);
});
// while the pointer is locked, clicks aim at the crosshair: re-send them from the screen centre
// so herbs.js / mug.js (which pick with clientX/Y) hit what the player is looking at
for (const type of ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'click']) {
  window.addEventListener(type, e => {
    if (!e.isTrusted || !locked() || e.target !== el) return;
    e.stopImmediatePropagation();
    const r = el.getBoundingClientRect();
    const init = { bubbles: true, cancelable: true, composed: true, button: e.button, buttons: e.buttons,
      clientX: r.left + r.width / 2, clientY: r.top + r.height / 2, movementX: e.movementX, movementY: e.movementY,
      shiftKey: e.shiftKey, ctrlKey: e.ctrlKey, altKey: e.altKey, metaKey: e.metaKey };
    const Ctor = type.startsWith('pointer') ? PointerEvent : MouseEvent;
    if (Ctor === PointerEvent) Object.assign(init, { pointerId: e.pointerId, pointerType: e.pointerType, isPrimary: e.isPrimary });
    el.dispatchEvent(new Ctor(type, init));
  }, true);
}
// unlocked fallback: right-drag to look (left button stays free for plants / mug)
let dragging = false, lastX = 0, lastY = 0, dragId = null;
el.addEventListener('pointerdown', e => {
  if (locked()) return;
  if (e.pointerType === 'mouse' && e.button !== 2) return;
  if (e.pointerType !== 'mouse' && padId !== null && e.pointerId === padId) return;
  dragging = true; dragId = e.pointerId; lastX = e.clientX; lastY = e.clientY;
});
addEventListener('pointerup', e => { if (e.pointerId === dragId) { dragging = false; dragId = null; } });
addEventListener('pointermove', e => {
  if (!dragging || e.pointerId !== dragId || locked()) return;
  yaw   -= (e.clientX - lastX) * 0.004;
  pitch -= (e.clientY - lastY) * 0.004;
  pitch = THREE.MathUtils.clamp(pitch, -1.5, 1.5);
  lastX = e.clientX; lastY = e.clientY;
});
addEventListener('keydown', e => { if (e.target.tagName !== 'INPUT') keys.add(e.code); });
addEventListener('keyup',   e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

// touch: on-screen stick (bottom left), drag anywhere else to look
const pad = document.getElementById('pad'), knob = pad.querySelector('i');
let padId = null; const padV = new THREE.Vector2();
pad.addEventListener('pointerdown', e => { padId = e.pointerId; pad.setPointerCapture(e.pointerId); padMove(e); });
pad.addEventListener('pointermove', e => { if (e.pointerId === padId) padMove(e); });
const padEnd = e => { if (e.pointerId !== padId) return; padId = null; padV.set(0, 0); knob.style.transform = ''; };
pad.addEventListener('pointerup', padEnd); pad.addEventListener('pointercancel', padEnd);
function padMove(e) {
  const r = pad.getBoundingClientRect(), R = r.width / 2;
  padV.set((e.clientX - r.left - R) / R, (e.clientY - r.top - R) / R);
  if (padV.length() > 1) padV.normalize();
  knob.style.transform = `translate(${padV.x * R * 0.6}px, ${padV.y * R * 0.6}px)`;
}

    turntable = new Turntable(scene, { position: new THREE.Vector3(TB.x, tableTop + 0.144 * TT, TB.z), scale: TT, rotationY: face(TB.x, TB.z), jukebox });
    jukebox.setPosition(new THREE.Vector3(TB.x, tableTop + 0.1, TB.z));                          // the music comes out of the turntable
    const c = bookBox.getCenter(new THREE.Vector3()), boardY = bookBox.min.y - 0.03;            // 3rd floor, left part (where the books were)
    new Prop(scene, 'angel', { scale: 0.30, position: new THREE.Vector3(c.x, boardY, c.z), rotationY: face(c.x, c.z), grab: true, garden });
    new Prop(scene, 'snow', { scale: 0.32, position: new THREE.Vector3(2.25, 1.55, -1.955), rotationY: face(2.25, -1.955), garden });   // coat-rack board top y=1.55
    new Prop(scene, 'deer', { scale: 0.45, position: new THREE.Vector3(1.95, 0.012, -0.40), rotationY: face(1.95, -0.40), garden });   // tree centre is at Blender y 1.23, its front edge ~0.46
    // bottles, lemon and knife (kitchen.js) are built by the flow (modules/flow.js) so they can be poured and cut there
    const go = () => jukebox.start();
    ['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, go, { passive: true }));
    renderer.xr.addEventListener('sessionstart', go);
    const mb = document.getElementById('music');
    mb.onclick = () => { mb.setAttribute('aria-pressed', String(jukebox.toggle())); };
  };
  ['Cube010', 'Cube023', 'Cube024'].forEach(n => {
    const o = root.getObjectByName(n); if (!o || !o.isMesh) return;
    o.updateWorldMatrix(true, false); const inv = o.matrixWorld.clone().invert(), P = o.geometry.attributes.position, V = new THREE.Vector3();
    for (let i = 0; i < P.count; i++) { V.fromBufferAttribute(P, i).applyMatrix4(o.matrixWorld); if (V.y > 0.3) V.y += LIFT; V.applyMatrix4(inv); P.setXYZ(i, V.x, V.y, V.z); }
    P.needsUpdate = true; o.geometry.computeBoundingBox(); o.geometry.computeBoundingSphere();
  });
  { const leg = root.getObjectByName('Cube024'); if (leg && leg.parent) { const c = leg.clone(); c.name = 'Cube024_b'; c.position.z -= 0.30; leg.parent.add(c); } }   // missing leg of the side desk
  // the mug sits on the desk corner next to the side desk (the small drawer cabinet stays inside the bookshelf)
  const mugNode = root.getObjectByName('MugCup');
  if (mugNode) mugNode.position.set(0.76, mugNode.position.y, -0.27);   // right of the cutting board, clear of the flow's stations
  // the hand-painted mug (made in Substance Painter from export/Mug.fbx): replace the cup + handle meshes by the painted ones. The new
  // geometry is in metres, yaw-correct, origin at the bottom centre of cup+handle - the same convention MugModule measures - so it is
  // dropped on the old mug's bottom centre. Base colour only, Lambert (cheap).
  if (mugNode && window.MUG_PAINTED) {
    root.updateMatrixWorld(true);
    const bx = new THREE.Box3().setFromObject(mugNode), MP = window.MUG_PAINTED;                      // old cup + old handle
    const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0)).buffer;
    const mk = d => { const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(b64(d.pos)), 3));
      g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(b64(d.nrm)), 3));
      g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(b64(d.uv)), 2));
      g.setIndex(new THREE.BufferAttribute(new Uint32Array(b64(d.idx)), 1)); return g; };
    const tex = new THREE.TextureLoader().load(MP.tex); tex.colorSpace = THREE.SRGBColorSpace; tex.flipY = false; tex.anisotropy = 1;
    // the painterly look lives in the NORMAL map (brush strokes) and the roughness channel (patchy glaze) - base colour is plain -
    // so this one small object keeps a Standard material with all three maps (R = occlusion, G = roughness, B = metallic)
    const ld = u => { const t = new THREE.TextureLoader().load(u); t.flipY = false; t.anisotropy = 1; return t; };
    const mugMat = new THREE.MeshStandardMaterial({ map: tex, normalMap: ld(MP.normal), roughnessMap: ld(MP.orm), metalnessMap: ld(MP.orm), roughness: 1, metalness: 1 });
    // the exported roughness is low everywhere (0.1-0.3 = glossy / wet-looking here, where there is no environment map): lift the floor so
    // the patchy variation stays but it reads as matte-satin ceramic. MUG_ROUGH_MIN: 0 = as painted, 1 = fully rough.
    const MUG_ROUGH_MIN = 0.6;
    mugMat.onBeforeCompile = sh => { sh.fragmentShader = sh.fragmentShader.replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\n roughnessFactor = mix(' + MUG_ROUGH_MIN.toFixed(2) + ', 1.0, roughnessFactor);'); };
    mugMat.customProgramCacheKey = () => 'mugrough'; mugMat.normalScale.set(0.7, 0.7);
    [...mugNode.children].forEach(c => mugNode.remove(c));                                           // old handle (Torus)
    mugNode.geometry = mk(MP.cup); mugNode.material = mugMat;
    mugNode.position.set((bx.min.x + bx.max.x) / 2, bx.min.y, (bx.min.z + bx.max.z) / 2); mugNode.quaternion.identity(); mugNode.scale.setScalar(1);
    mugNode.add(new THREE.Mesh(mk(MP.handle), mugMat));
    mugNode.updateMatrixWorld(true);
  }   // x 0.74, 0.12 m right of centre, on the desk
  if (trayN) {
    const names = ['Lavender', 'Mint', 'Lemongrass', 'Rose'];
    const parts = n => ['DeskPot_', 'PotSoil_', 'Plant_'].flatMap(p => [p + n, p + n + '_Bloom', p + n + '_stem']).map(k => root.getObjectByName(k)).filter(Boolean);
    const xc = names.map(n => new THREE.Box3().setFromObject(root.getObjectByName('DeskPot_' + n)).getCenter(new THREE.Vector3()).x);
    const mean = xc.reduce((p, v) => p + v, 0) / xc.length;
    names.forEach((n, i) => parts(n).forEach(o => o.position.x += (xc[i] - mean) * (0.75 - 1)));   // pots 25 % closer
    const tg = trayN.geometry; tg.computeBoundingBox();                                           // tray mesh 22 % shorter
    const cx = (tg.boundingBox.min.x + tg.boundingBox.max.x) / 2, tp = tg.attributes.position;
    for (let i = 0; i < tp.count; i++) tp.setX(i, (tp.getX(i) - cx) * 0.78 + cx);
    tp.needsUpdate = true; tg.computeBoundingBox(); tg.computeBoundingSphere();
    trayN.position.x += 1.15 - mean;                                            // centre at the player's x (~1.07..1.15)
  }
  // ---- CONVEYOR table 1 (making): every ingredient on the one desk in front. Herb tray from the side desk -> front-right corner of the
  // desk (turned along it), the bottle rack 14 cm further back to make room, the mug to the back, the left legs under the desk end.
  // The drawer cabinet joins after DrawerSet is made (below). modules/conveyor.js moves the whole desk out through the left wall later.
  const placeW = (o, yaw, x, z, dy = 0) => {        // turn an object about its own centre (world y axis) and put that centre at x, z
    if (!o) return; scene.updateMatrixWorld(true);
    const c = new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3()), par = o.parent, piv = new THREE.Group();
    scene.add(piv); piv.position.set(c.x, 0, c.z); piv.updateMatrixWorld(true); piv.attach(o);
    piv.rotation.y = yaw; piv.position.set(x, dy, z); piv.updateMatrixWorld(true); par.attach(o); piv.removeFromParent();
  };
  placeW(trayN, Math.PI / 2, 0.695, -0.555);
  moveW(root.getObjectByName('HerbTray002'), RACK_DX, 0, 0);
  placeW(root.getObjectByName('MugCup'), 0, 0.26, -0.12);
  ['Cube009', 'Cube026'].forEach(n => {               // the desk's left legs were short (hidden by the shelf): full height, under the top
    const o = root.getObjectByName(n); if (!o || !o.isMesh) return;
    o.updateWorldMatrix(true, false); const inv = o.matrixWorld.clone().invert(), P = o.geometry.attributes.position, V = new THREE.Vector3();
    for (let i = 0; i < P.count; i++) { V.fromBufferAttribute(P, i).applyMatrix4(o.matrixWorld); if (V.y > 0.3) V.y += LIFT; V.applyMatrix4(inv); P.setXYZ(i, V.x, V.y, V.z); }
    P.needsUpdate = true; o.geometry.computeBoundingBox(); o.geometry.computeBoundingSphere();
    moveW(o, 0, 0, -0.13);
  });
  { const rolls = root.getObjectByName('PaperRollRack'); if (rolls) rolls.visible = false; }   // shown on the wrapping table (conveyor.js)
  if (HerbGarden) try {   // herbs.js: edit there, both pages follow
    let picked = 0;
    garden = new HerbGarden(root, scene, { colliders: [root], onHarvest: (label, k, it) => toast(`${label} ${it?.count || 1}개 채취 · 모두 ${picked += (it?.count || 1)}개`) });
    garden.attachHands(renderer, rig);
    garden.enableMouse(renderer.domElement, camera, 0);   // desktop: left button on a plant/mug; right-drag = look
    if (MugModule) window.__mug = new MugModule(root, scene, garden, camera);   // mug.js: cocoa, steam, drink at the mouth
    window.__garden = garden;
  } catch (e) { garden = null; console.error(e); showErr('herbs: ' + e.message); }
  try {   // drawers.js moves front + knob + name tag; the flow decides when a drawer opens (click / point / touch), so it gets its own hub
    if (DrawerSet) { drawerSet = new DrawerSet(root, scene, { extras: [], ray: new THREE.Raycaster() }); window.__drawers = drawerSet; }
    paperTags(root);
    // CONVEYOR: the cabinet stands on the back-left of the making desk, its drawers facing the player (+x)
    const cab = root.getObjectByName('MaterialDrawer');
    if (cab) { root.updateMatrixWorld(true); const b = new THREE.Box3().setFromObject(cab); placeW(cab, -Math.PI / 2, 0.29, 0.47, 0.906 - b.min.y); }
  } catch (e) { console.error(e); showErr('drawers: ' + e.message); }
  // these move at run time: keep them out of the static freeze below
  garden?.plants.forEach(p => { p.mesh.userData.dynamic = true; });
  root.getObjectByName('MugCup')?.traverse(o => { o.userData.dynamic = true; });
  try { setupProps(); } catch (e) { console.error(e); showErr('props: ' + e.message); }

  // ---- performance passes
  // (a) cap texture size. Desktop: 2048. Quest: by the size of the object that uses the texture - every prop has its own
  // baked 2K image (149 textures = ~120 megapixels), a book or a drawer knob does not need that: <0.3 m -> 128, <0.8 m -> 256, <1.6 m -> 512, else 1024 (walls: 256)
  const MAPS = ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap', 'aoMap'], texDim = new Map();
  root.updateMatrixWorld(true);
  root.traverse(o => { if (!o.isMesh) return;
    const sz = new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3()), d = Math.max(sz.x, sz.y, sz.z);
    for (const m of [].concat(o.material)) for (const k of MAPS) { const t = m && m[k]; if (t) texDim.set(t, Math.max(texDim.get(t) || 0, /Wall|Shell|^Cube$|Roof|Ceil/.test(o.name) ? 0.5 : d)); } });   // plaster walls are smooth baked light: 512 is plenty
  for (const [t, d] of texDim) {
    const cap = !QUEST ? 2048 : d < 0.3 ? 128 : d < 0.8 ? 256 : d < 1.6 ? 512 : 1024, im = t.image;
    if (t.isCompressedTexture || !im || !(im.width > cap || im.height > cap)) continue;     // KTX2 textures are already sized + compressed
    const f = cap / Math.max(im.width, im.height), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(im.width * f)); c.height = Math.max(1, Math.round(im.height * f)); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    t.image = c; t.needsUpdate = true;
  }
  // (a2) Quest: Standard (PBR) -> Lambert for opaque props: the colour is baked into the texture anyway, so the expensive
  // specular / IBL maths buys nothing. Kept as they are: glass & other transparent materials, normal-mapped ones, the swaying vines.
  if (LITE) {
    const cache = new Map();
    root.traverse(o => { if (!o.isMesh) return;
      const conv = m => {
        if (m && m.isMeshStandardMaterial && m.metalness > 0.3) m.metalness = 0.3;   // no environment map here: full metal renders BLACK (knobs, hooks)
        if (!m || !m.isMeshStandardMaterial || m.isMeshPhysicalMaterial || m.transparent || m.normalMap || m.userData.keep) return m;
        if (!cache.has(m)) { const n = new THREE.MeshLambertMaterial({ name: m.name, map: m.map, color: m.color, emissive: m.emissive, emissiveIntensity: m.emissiveIntensity,
          emissiveMap: m.emissiveMap, aoMap: m.aoMap, aoMapIntensity: m.aoMapIntensity, side: m.side, alphaTest: m.alphaTest, alphaMap: m.alphaMap, vertexColors: m.vertexColors });
          cache.set(m, n); } return cache.get(m); };
      o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material); });
  }
  // (a3) log-cabin walls: the baked wall textures are plain plaster, so paint horizontal logs over the vertical wall faces in
  // world space (planks stay level across every wall and the door cut). The baked texture's brightness is kept as the lighting.
  const LOG_GLSL = `
    vec3 wn = normalize(cross(dFdx(vWP), dFdy(vWP)));
    if (abs(wn.y) < 0.5) {
      float u = abs(wn.x) > abs(wn.z) ? vWP.z : vWP.x, y = vWP.y;
      float LH = 0.22, row = floor(y / LH), fy = fract(y / LH), rid = h21(vec2(row, 3.7));
      float belly = sin(fy * 3.14159), seam = smoothstep(0.0, 0.10, fy) * smoothstep(1.0, 0.90, fy);
      float g = vn(vec2(u * 2.2 + rid * 40.0, y * 38.0)) * 0.6 + vn(vec2(u * 7.0 + rid * 11.0, y * 90.0)) * 0.4;
      float jx = fract((u + rid * 2.3) / (1.2 + rid * 0.9)), joint = smoothstep(0.0, 0.012, jx) * smoothstep(1.0, 0.988, jx);
      vec3 wood = mix(vec3(0.20, 0.095, 0.04), vec3(0.42, 0.22, 0.09), 0.35 + 0.65 * g);
      wood *= 0.78 + 0.4 * rid; wood *= (0.55 + 0.5 * belly) * (0.35 + 0.65 * seam) * (0.6 + 0.4 * joint);
      float lum = dot(diffuseColor.rgb, vec3(0.3333));
      diffuseColor.rgb = wood * clamp(lum * 2.2, 0.35, 1.5);
    }`;
  const logWall = (m) => {
    if (!m || m.userData.logged) return; m.userData.logged = true;
    m.onBeforeCompile = (sh) => {
      sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWP;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWP = (modelMatrix * vec4(transformed, 1.0)).xyz;');
      sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
        varying vec3 vWP;
        float h21(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float vn(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
          return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y); }`)
        .replace('#include <map_fragment>', '#include <map_fragment>\n' + LOG_GLSL);
    };
    m.customProgramCacheKey = () => 'logwall'; m.needsUpdate = true;
  };
  root.traverse(o => { if (o.isMesh && ['WestWallRound', 'RoomShell', 'Cube'].includes(o.name)) [].concat(o.material).forEach(logWall); });

  // (b) Quest: the tree's baubles/lights are ~300k vertices of tiny spheres. Each ball is its own connected piece, so
  // find the pieces (union-find over the index buffer) and draw them as ONE InstancedMesh of a 80-triangle sphere.
  if (LITE) root.traverse(o => {
    if (!o.isMesh || !o.geometry.index || !/Tree_Ornaments_Bauble|Tree_Lights$/.test(o.name)) return;
    const g = o.geometry, P = g.attributes.position, I = g.index.array, par = new Int32Array(P.count).map((_, i) => i);
    const find = a => { while (par[a] !== a) a = par[a] = par[par[a]]; return a; };
    for (let i = 0; i < I.length; i += 3) { par[find(I[i])] = find(I[i + 1]); par[find(I[i + 1])] = find(I[i + 2]); }
    const cl = new Map();
    for (let i = 0; i < P.count; i++) { const r = find(i); let c = cl.get(r); if (!c) cl.set(r, c = { s: new THREE.Vector3(), n: 0, v: [] }); c.s.x += P.getX(i); c.s.y += P.getY(i); c.s.z += P.getZ(i); c.n++; c.v.push(i); }
    const inst = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), o.material, cl.size), M = new THREE.Matrix4(), C = new THREE.Vector3(), V = new THREE.Vector3();
    let k = 0; for (const c of cl.values()) {
      C.copy(c.s).multiplyScalar(1 / c.n); let r = 0;
      for (const i of c.v) r = Math.max(r, V.fromBufferAttribute(P, i).distanceTo(C));
      inst.setMatrixAt(k++, M.compose(C, new THREE.Quaternion(), new THREE.Vector3(r, r, r)));
    }
    inst.position.copy(o.position); inst.quaternion.copy(o.quaternion); inst.scale.copy(o.scale); inst.name = o.name + '_lite';
    o.parent.add(inst); o.visible = false; o.geometry.dispose();
  });
  // (c) static room meshes never move: stop recomputing their matrices every frame (skinned herbs + mug keep theirs)
  root.updateMatrixWorld(true);
  root.traverse(o => { if (o.isMesh && !o.isSkinnedMesh && !o.userData.dynamic) { o.matrixAutoUpdate = false; o.updateMatrix(); } });

  const box = new THREE.Box3().setFromObject(root);
  window.__dbg = { THREE, scene, root, camera, renderer, composer, box, lights, P, colliders, setLook: (y, p = 0) => { yaw = y; pitch = p; },
    sim: (y, sec, key = 'KeyW') => { yaw = y; keys.add(key); for (let i = 0; i < sec * 60; i++) moveStep(1 / 60); keys.delete(key); return [P.feet.x, P.feet.y, P.feet.z, P.eye].map(v => +v.toFixed(2)); } };
  buildColliders(root);
  applyStand();    // stand on the real floor now that it exists
  document.getElementById('loading').classList.add('done');
  // the experience: Nicolas comes in through the door and greets you -> recipe book -> make a bath bomb -> wrap -> letter -> send
  import('./modules/flow.js').then(({ startFlow }) => {
    flow = startFlow({ colliders, scene, root, camera, renderer, rig, garden, canvas: renderer.domElement, toast, P, cast, drawerSet, layout: SPACE_LAYOUT,
      door: root.getObjectByName('DoorLeaf'), view: { get: () => [yaw, pitch], set: (y, p) => { yaw = y; pitch = p; }, home: [STAND.yaw, STAND.pitch] },
      hintEl: document.getElementById('hint'), fire: { setLevel: (k) => fireFx.setLevel?.(k) } });
    window.__flow = flow;
  }).catch(e => { console.error(e); showErr('flow: ' + e.message); });
}
const onRoomErr = (e) => { showErr('GLB 로드 실패: ' + (e?.message || e) + '\n→ room.glb.js (또는 room.glb) 파일이 index.html 옆에 있어야 해요.');
  document.getElementById('loading').classList.add('done'); };
if (window.ROOM_GLB_B64) loader.parse(Uint8Array.from(atob(window.ROOM_GLB_B64), c => c.charCodeAt(0)).buffer, '', onRoom, onRoomErr);
else loader.load('../room.glb', onRoom, (ev) => { if (ev.total) bar.style.width = (100 * ev.loaded / ev.total) + '%'; }, onRoomErr);

// ---------------------------------------------------------------- ui
const expEl = document.getElementById('exp'), expV = document.getElementById('expv');
expEl.oninput = () => { renderer.toneMappingExposure = +expEl.value; expV.textContent = (+expEl.value).toFixed(2); };
const blmEl = document.getElementById('blm'), blmV = document.getElementById('blmv');
blmEl.oninput = () => { bloom.strength = +blmEl.value; blmV.textContent = (+blmEl.value).toFixed(2); };
const litEl = document.getElementById('lit'), litV = document.getElementById('litv');
litEl.oninput = () => {
  const mult = +litEl.value;
  LIGHT_SCALE = BASE_LIGHT_SCALE * mult;
  litV.textContent = mult.toFixed(2);
  keptLights.forEach(l => l.intensity = l.userData.baseIntensity * LIGHT_SCALE);
  rectLights.forEach(l => l.intensity = l.userData.baseIntensity * mult);
};
const modeBtn = document.getElementById('mode');
modeBtn.onclick = () => {
  walkMode = !walkMode;
  modeBtn.textContent = walkMode ? '1인칭 걷기' : '자유 비행';
  modeBtn.setAttribute('aria-pressed', String(walkMode));
  if (walkMode) { const fy = colliders.length ? floorAt(camera.position.x, camera.position.y - P.eye, camera.position.z) : null;
    if (fy !== null) P.feet.set(camera.position.x, fy, camera.position.z); }
  placeCamera();
};
const shBtn = document.getElementById('shadows');
shBtn.onclick = () => {
  const on = renderer.shadowMap.enabled = !renderer.shadowMap.enabled;
  shBtn.setAttribute('aria-pressed', String(on));
  shadowCasters.forEach(l => l.castShadow = on);
  scene.traverse(o => { if (o.isMesh) o.material && (Array.isArray(o.material) ? o.material : [o.material])
    .forEach(m => m && (m.needsUpdate = true)); });
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

let _last = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min((now - _last) / 1000, 0.1); _last = now;
  if (renderer.xr.isPresenting) vrStep(dt); else moveStep(dt);
  garden?.update(dt); turntable?.update(dt); drawerSet?.update(dt);
  try { flow?.update(dt, now / 1000); } catch (e) { console.error(e); }
  if (fireFx.light) {
    const t = now / 1000;
    fireFx.light.intensity = (1.6 + Math.sin(t*13)*.25 + Math.sin(t*31.7)*.2 + (Math.random()-.5)*.15) * fireLevel.k;
    fireFx.tick?.(t);
  }
  swayT.value = now / 1000; fireFx.snow?.(now / 1000, dt);
  for (const h of fireFx.halos) h.material.opacity = 0.4 + Math.sin(now / 1000 * 1.5 + h.userData.ph) * 0.08;   // gentle twinkle
  // EffectComposer does not work in WebXR - draw straight to the headset
  if (renderer.xr.isPresenting) renderer.render(scene, camera);
  else composer.render();
  window.Audio3D?.update(camera);
});
</script>
